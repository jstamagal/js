[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "js"
version = "0.2.4"
description = "Personal terminal LLM harness with hacking tools"
requires-python = ">=3.12"
dependencies = [
    "ai[openai,anthropic]>=0.9.0",
    "openai>=3.52.0",
    "anthropic>=1.17.0",
    "httpx>=0.28.1",
    "pexpect>=4.9.0",
    "prompt_toolkit>=3.0",
    "pyte>=0.8.2",
    "PyYAML>=6.0",
    "rich>=13.0",
    "tomli_w>=1.0",
    # Core tool argument validation; referencing brings native rpds-py.
    "jsonschema>=4.26.0",
    "httpx2>=2.16.2",
    # The jev tool.
    "typesafe-sdk>=0.7.5",
    "markdown-it-py>=3.0",
    "agent-client-protocol>=1.0.0",
]

[project.optional-dependencies]
kernel = [
    "ipykernel>=6.29; sys_platform != 'android'",
    "jupyter_client>=8.0; sys_platform != 'android'",
]
vision = [
    "Pillow>=10.0; sys_platform != 'android'",
]
browser = [
    "js[vision]",
    "playwright>=1.65.2; sys_platform != 'android'",
]
test = [
    "js[kernel,vision,browser]",
    "pytest>=9.0",
    "pytest-xdist>=3.6",
]

[project.scripts]
js = "js.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# defaults/ holds the stock setup beside the js package.
include = ["js*", "defaults*"]

[tool.pytest.ini_options]
# Raw `pytest` runs the offline suite in parallel, as `just test` does;
# `-m live` (or `just test-live`) opts in, `-n0` runs serial.
addopts = "-m 'not ai_provider and not vision and not e2e and not live' -n logical --dist worksteal"
markers = [
    "e2e: exercises a complete user-visible runtime path",
    "ai_provider: requires configured ai-python provider credentials or local OpenAI-compatible endpoint",
    "vision: requires a reachable local vision model (ollama gemma4:e4b) and Pillow",
    "live: drives a real browser or network endpoint; excluded from `just test`",
]

[tool.setuptools.package-data]
"js" = ["jsrc.template", "tool_releases.json"]
"js.toolkit" = ["toolbox_examples/*.py"]
"defaults" = ["jsrc", "fset", "secret-patterns", "themes/*", "help/*", "agents/**/*", "tool_descriptions/*", "skills/**/*", "snippets/*.md"]

# dev tooling for agents hacking this code (and for the justfile quality
# recipes). synced into the project env by `uv sync`, so ruff lands on the
# venv PATH and js agents can call it through the shell tool directly.
[dependency-groups]
dev = [
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
# .scratch holds working notes and benchmark artifacts, not code that ships;
# ruff walking it fails the gate on whatever a sweep happened to leave there.
exclude = [".scratch"]

[tool.ruff.lint]
# The rule set is named here, not left to ruff's defaults, so a ruff upgrade
# does not change what the gate checks: errors, pyflakes, pyupgrade, import
# order.
select = ["E4", "E7", "E9", "F", "UP", "I"]

[tool.ruff.lint.isort]
# `from js import cli, memory as M` stays one statement.
combine-as-imports = true
