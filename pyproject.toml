[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "js"
version = "0.1.0"
description = "LO-shaped AI SDK agent with hacking tools"
requires-python = ">=3.12"
dependencies = [
    "ai[openai,anthropic]==0.4.2",
    # `just install` resolves from these constraints rather than uv.lock. Keep
    # the provider boundary aligned with the tested lock: openai 3 switched to
    # httpx2/httpcore2 and exposed a broken async-generator shutdown path.
    "openai==2.44.0",
    "anthropic==0.113.0",
    "httpx==0.28.1",
    # the persistent-kernel tools (js/toolkit/kernel.py, toolbox.py). base deps,
    # not an extra: one box, one user, and a mode that half-installs is a mode
    # that fails at the worst moment. the tools still degrade to one clear ERROR
    # naming the package if an env somehow lacks them.
    "ipykernel>=6.29",
    "jupyter_client>=8.0",
    "pexpect>=4.9.0",
    "Pillow>=10.0",
    "prompt_toolkit>=3.0",
    "pyte>=0.8.2",
    "PyYAML>=6.0",
    # direct import in transcript.py, tui.py, and toolkit/kernel.py. was riding
    # in transitively on textual; declared now because three modules import it.
    "rich>=13.0",
    "textual>=0.85",
    "tomli_w>=1.0",
    "platformdirs>=4.0",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.61.0",
]
test = [
    "pytest>=9.0",
]

[project.scripts]
js = "js.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["js*"]

[tool.pytest.ini_options]
markers = [
    "e2e: exercises a complete user-visible runtime path",
    "ai_provider: requires configured ai-python provider credentials or local OpenAI-compatible endpoint",
    "vision: requires a reachable local vision model (ollama gemma4:e4b) and Pillow",
]

[tool.setuptools.package-data]
"js.toolkit" = ["tool_descriptions/*.md"]

# dev tooling for agents hacking this code (and for the justfile quality
# recipes). synced into the project env by `uv sync`, so ruff lands on the
# venv PATH and js agents can call it through the shell tool directly.
[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
# giant prompt-string template builder; linting it is pure noise.

[tool.ruff.lint]
# defaults already cover E (errors) + F (pyflakes); add pyupgrade.
extend-select = ["UP"]
